<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wall of Cats 🐾</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0d1117;
      color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      padding: 20px;
    }
    header {
      text-align: center;
      margin-bottom: 25px;
    }
    h1 {
      font-size: 2.2rem;
      margin-bottom: 8px;
      color: #58a6ff;
    }
    p.subtitle {
      color: #8b949e;
      font-size: 1rem;
      margin-bottom: 20px;
    }
    .upload-card {
      background: #161b22;
      border: 1px dashed #30363d;
      border-radius: 12px;
      max-width: 480px;
      margin: 0 auto 30px auto;
      padding: 20px;
      text-align: center;
    }
    .upload-card input[type="text"] {
      width: 100%;
      padding: 10px 14px;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 8px;
      color: #fff;
      font-size: 0.95rem;
      margin-bottom: 12px;
    }
    .file-label {
      display: inline-block;
      background: #238636;
      color: #fff;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.95rem;
      margin-bottom: 8px;
    }
    .upload-card input[type="file"] {
      display: none;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 18px;
      max-width: 1200px;
      margin: 0 auto 40px auto;
    }
    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .card img {
      width: 100%;
      height: 240px;
      object-fit: cover;
      background: #21262d;
    }
    .card-info {
      padding: 12px 14px;
    }
    .card-title {
      font-size: 1.05rem;
      font-weight: 600;
      color: #f0f6fc;
    }
    .comments-section {
      max-width: 800px;
      margin: 40px auto;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 20px;
    }
    .comments-section h2 {
      font-size: 1.3rem;
      margin-bottom: 16px;
      color: #58a6ff;
    }
  </style>
</head>
<body>

  <header>
    <h1>🐾 Wall of Cats</h1>
    <p class="subtitle">Přidejte svou kočku na zeď!</p>
  </header>

  <div class="upload-card">
    <input type="text" id="catName" placeholder="Jméno kočky (např. Quentin)">
    <label class="file-label" for="catPhoto">📷 Vybrat fotku kočky</label>
    <input type="file" id="catPhoto" accept="image/*">
    <p id="statusMsg" style="font-size: 0.85rem; color: #8b949e; margin-top: 6px;"></p>
  </div>

  <div class="grid" id="catGrid"></div>

  <section class="comments-section">
    <h2>Napište nám vzkaz nebo komentář</h2>
    <div id="cusdis_thread"
      data-host="https://cusdis.com"
      data-app-id="02a1147a-8ae8-490b-80a5-e366d482cf19"
      data-page-id="wallofcats_main"
      data-page-url="https://wallofcats.eu"
      data-page-title="Wall of Cats">
    </div>
    <script async defer src="https://cusdis.com/js/cusdis.es.js"></script>
  </section>

  <script>
    const defaultCats = [
      { name: "Quentin", img: "https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?auto=format&fit=crop&w=600&q=80" },
      { name: "Mourka", img: "https://images.unsplash.com/photo-1573865526739-10659fec78a5?auto=format&fit=crop&w=600&q=80" },
      { name: "Oliver", img: "https://images.unsplash.com/photo-1495360010541-f48722b34f7d?auto=format&fit=crop&w=600&q=80" }
    ];

    const catGrid = document.getElementById('catGrid');
    const catPhoto = document.getElementById('catPhoto');
    const catName = document.getElementById('catName');
    const statusMsg = document.getElementById('statusMsg');

    function loadCats() {
      const stored = JSON.parse(localStorage.getItem('user_cats') || '[]');
      const all = [...stored, ...defaultCats];
      catGrid.innerHTML = '';
      all.forEach(cat => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `<img src="${cat.img}" alt="${cat.name}"><div class="card-info"><div class="card-title">${cat.name}</div></div>`;
        catGrid.appendChild(card);
      });
    }

    catPhoto.addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;
      const name = catName.value.trim() || 'Kočička';

      const reader = new FileReader();
      reader.onload = function(evt) {
        const base64Img = evt.target.result;
        const stored = JSON.parse(localStorage.getItem('user_cats') || '[]');
        stored.unshift({ name: name, img: base64Img });
        try {
          localStorage.setItem('user_cats', JSON.stringify(stored));
        } catch (err) {
          console.warn("Plná paměť", err);
        }
        catName.value = '';
        catPhoto.value = '';
        statusMsg.textContent = 'Fotka byla přidána na zeď!';
        loadCats();
      };
      reader.readAsDataURL(file);
    });

    loadCats();
  </script>
</body>
</html>
