<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wall of Cats</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #121212;
      color: #f1f1f1;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 30px 15px;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
    }

    header h1 {
      font-size: 2.5rem;
      color: #ff9800;
      margin-bottom: 10px;
      letter-spacing: 1px;
    }

    header p {
      color: #aaa;
      font-size: 1.1rem;
    }

    /* Mřížka pro zeď fotek */
    .wall-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
      margin-bottom: 50px;
    }

    .cat-card {
      background: #1e1e1e;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .cat-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 25px rgba(255, 152, 0, 0.2);
    }

    .cat-card img {
      width: 100%;
      height: 280px;
      object-fit: cover;
      display: block;
    }

    .cat-caption {
      padding: 15px;
      font-size: 0.95rem;
      color: #ddd;
      text-align: center;
    }

    /* Sekce pro komentáře */
    .comments-section {
      background: #1e1e1e;
      border-radius: 12px;
      padding: 30px;
      max-width: 800px;
      margin: 0 auto;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
    }

    .comments-section h2 {
      font-size: 1.6rem;
      color: #ff9800;
      margin-bottom: 25px;
      text-align: center;
    }

    footer {
      text-align: center;
      margin-top: 50px;
      color: #666;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>🐾 Wall of Cats</h1>
      <p>Komunitní zeď koček a kocourů</p>
    </header>

    <!-- ZEĎ S FOTKAMI -->
    <main class="wall-grid">
      <div class="cat-card">
        <img src="foto1.jpg" alt="Kočka 1">
        <div class="cat-caption">Krasavec na zdi #1</div>
      </div>
      <div class="cat-card">
        <img src="foto2.jpg" alt="Kočka 2">
        <div class="cat-caption">Krasavec na zdi #2</div>
      </div>
      <div class="cat-card">
        <img src="foto3.jpg" alt="Kočka 3">
        <div class="cat-caption">Krasavec na zdi #3</div>
      </div>
      <div class="cat-card">
        <img src="foto4.jpg" alt="Kočka 4">
        <div class="cat-caption">Krasavec na zdi #4</div>
      </div>
      <div class="cat-card">
        <img src="foto5.jpg" alt="Kočka 5">
        <div class="cat-caption">Krasavec na zdi #5</div>
      </div>
    </main>

    <!-- SEKCE PRO KOMENTÁŘE -->
    <section class="comments-section">
      <h2>Napište nám vzkaz nebo komentář</h2>
      
      <div id="cusdis_thread"
        data-host="https://cusdis.com"
        data-app-id="SEM_VLOZTE_SVOJE_ID"
        data-page-id="wall-of-cats-main"
        data-page-url="https://wallofcats.eu"
        data-page-title="Wall of Cats">
      </div>
      <script async defer src="https://cusdis.com/js/cusdis.es.js"></script>
    </section>

    <footer>
      &copy; Wall of Cats. Všechna práva vyhrazena.
    </footer>
  </div>

</body>
</html>
